spring.application.name=mars-backend

# Configuração do PostgreSQL
spring.config.import=optional:file:../.env.local[.properties],optional:file:.env.local[.properties]
mars.database.url=${DATABASE_URL:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000

# Configuração do JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Porta do backend
server.port=${PORT:8081}
mars.cors.allowed-origins=${MARS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

# JWT Secret

mars.jwt.secret=${MARS_JWT_SECRET}

# Chat: sem credenciais, consultas diretas ao catálogo continuam disponíveis.
mars.chat.base-url=${MARS_AI_BASE_URL:}
mars.chat.api-key=${MARS_AI_API_KEY:}
mars.chat.model=${MARS_AI_MODEL:}
