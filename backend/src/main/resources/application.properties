spring.application.name=mars-backend

# Configuração do PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/mars_real_estate
spring.datasource.username=postgres
spring.datasource.password=a

# Configuração do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Porta do backend
server.port=8081

# JWT Secret

mars.jwt.secret=${MARS_JWT_SECRET}